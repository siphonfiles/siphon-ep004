name: delete releases
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to delete, space separated (e.g. ep001-render-3 ep001-render-4)"
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $TAGS; do
            case "$t" in ep[0-9]*-render-[0-9]*) ;; *) echo "skip $t (only render releases)"; continue;; esac
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y && echo "deleted $t"
          done
