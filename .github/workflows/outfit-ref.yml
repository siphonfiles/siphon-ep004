name: outfit ref (Thomas new outfit, ZeroGPU)
# Manual only (uses the ZeroGPU quota). step=portrait: 3 outfit portraits with Z-Image-Turbo (seed 596067).
# step=desk: Qwen-Image-Edit-2511 puts the chosen portrait at the ep. 001 desk -> 1920x1080 reference.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "portrait | desk"
        required: true
        default: portrait
      portrait:
        description: "(desk) chosen portrait path in the repo"
        default: ""
      outfit:
        description: "(desk) the outfit sentence used for that portrait"
        default: ""
permissions:
  contents: write
concurrency:
  group: zerogpu
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client pillow
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.step }}" = "portrait" ]; then
            python scripts/gen_outfit_portrait.py presenter/outfits/ep004
          else
            python scripts/gen_outfit_desk.py "${{ inputs.portrait }}" "${{ inputs.outfit }}" presenter/outfits/ep004
            cp presenter/outfits/ep004/thomas_ref_ep004_1920x1080.png presenter/reference/
          fi
      - name: Commit to main (rule 18c)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add presenter && git commit -qm "outfit ref: ${{ inputs.step }} (run ${GITHUB_RUN_NUMBER})" && git pull --rebase -q && git push -q || echo "nothing to commit"
