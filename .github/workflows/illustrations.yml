name: illustrations (Z-Image)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "JSON cu imaginile (ex. illustrations/ep001/style_test.json)"
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/gen_illustrations.py "${{ inputs.job }}"
      - name: Publish to renders branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          cp -r out /tmp/pub
          git fetch --depth 1 origin renders || true
          if git rev-parse --verify -q origin/renders; then git switch -c renders origin/renders; else git switch --orphan renders; fi
          D="illustrations/run-${GITHUB_RUN_NUMBER}"; mkdir -p "$D" && cp /tmp/pub/* "$D/"
          git add illustrations && git commit -m "illustrations ${GITHUB_RUN_NUMBER}" && git push origin renders
