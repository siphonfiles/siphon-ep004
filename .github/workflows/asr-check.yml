name: asr check (voice lines vs script, CPU)
on:
  workflow_dispatch:
    inputs:
      dir:
        description: "Folder on the voice-tests branch"
        default: lines/ep001-final
      model:
        default: small.en
      ids:
        description: "only these line ids (comma), with word timings"
        default: ""
      lines:
        description: "lines JSON in the repo (texts); empty = texts.json in the folder"
        default: ""
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q faster-whisper
      - name: Lines
        run: |
          git fetch --depth 1 origin voice-tests
          mkdir -p lines && git archive FETCH_HEAD "${{ inputs.dir }}" | tar -x -C lines
      - env:
          ASR_MODEL: ${{ inputs.model }}
          ASR_IDS: ${{ inputs.ids }}
          ASR_LINES: ${{ inputs.lines }}
        run: python scripts/asr_check.py "lines/${{ inputs.dir }}" asr_report.md; cat asr_report.md
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          cp asr_report.md /tmp/
          git fetch --depth 1 origin voice-tests && git switch -c vt FETCH_HEAD
          mkdir -p reports && cp /tmp/asr_report.md "reports/asr_${GITHUB_RUN_NUMBER}_${{ inputs.model }}.md"
          git add reports && git commit -m "ASR report ${GITHUB_RUN_NUMBER}" && (git push origin HEAD:voice-tests || (git pull --rebase origin voice-tests && git push origin HEAD:voice-tests))
